<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7c3aed">
    <title>Sin conexión - ML Grupo</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #faf8ff; color: #1c1c1e; text-align: center; padding: 1.5rem; }
        .card { max-width: 22rem; }
        img { width: 5rem; height: 5rem; border-radius: 1.2rem; }
        h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
        p { color: #52525b; font-size: .95rem; line-height: 1.4; }
        button { margin-top: 1rem; background: #7c3aed; color: #fff; border: 0; border-radius: .6rem; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="ML Grupo">
        <h1>Sin conexión</h1>
        <p>Necesitas internet para registrar y consultar cuentas. Revisa tu conexión e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
